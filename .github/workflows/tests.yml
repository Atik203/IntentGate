name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          INTENT_GATE_OFFLINE_EMBEDDINGS: "1"
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact image
        run: docker build --tag intentgate:phase7 .
      - name: Run tests inside container
        run: docker run --rm -e INTENT_GATE_OFFLINE_EMBEDDINGS=1 intentgate:phase7 pytest -q
      - name: Run offline reporter inside container
        run: docker run --rm intentgate:phase7 python scripts/report_phase5.py --dir results/phase5 --out /tmp/phase5_report.json
