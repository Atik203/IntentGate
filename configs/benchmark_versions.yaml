  downloaded: 2026-09-11
  cases: 1348
  servers: 45
  tools: 485
  layout:
    pure_tool.json: 45 servers; poisoned tool descriptions + security risk label
    response_all.json: recorded responses (attack_scopes 11, label_scopes 5, call_behaviors 4)
