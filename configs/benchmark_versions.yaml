# Pinned benchmark versions (blueprint Sec 8 — reproducibility).
# Recorded 2026-09-11. Every results log must cite these versions.
# Re-clone: powershell -ExecutionPolicy Bypass -File scripts/clone_benchmarks.ps1

InjecAgent:
  source: https://github.com/uiuc-kang-lab/InjecAgent
  commit: f19c9f2c79a41046eb13c03c51a24c567a8ffa07
  shallow: true
  cases:
    ds_base: 544      # data stealing, base setting
    ds_enhanced: 544  # same cases + hacking prompt
    dh_base: 510      # direct harm, base setting
    dh_enhanced: 510  # same cases + hacking prompt
    total: 2108       # 1054 unique cases x 2 settings
  support_files:
    tools.json: 38 tool definitions (17 user + 62 attacker categories)
    attacker_simulated_responses.json: 2347 canned attacker-tool responses
  case_fields:
    - User Instruction
    - User Tool
    - Tool Parameters          # string repr of dict
    - Tool Response            # already contains injected Attacker Instruction
    - Attacker Tools           # list of tool names
    - Attacker Instruction
    - Attack Type
    - Expected Achievements

