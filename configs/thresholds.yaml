# Threshold sweep grid (blueprint Sec 5/9). Report full Pareto, not a single tau.
tau_grid: [0.4, 0.5, 0.6, 0.7, 0.8]
delta_grid: [0.05, 0.1, 0.15]
defaults:
  alpha: 0.7      # S = alpha * S_sem + (1-alpha) * S_rule, with critical veto S_rule==0 -> S=0
  tau: 0.6
  delta: 0.1
benchmark_mode:
  # In benchmark runs there is no human in the loop:
  # escalate counts as block + separate would_escalate flag.
  escalate_as_block: true
